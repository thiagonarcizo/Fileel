<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title description">
  <title id="title">Fileel — your files, one gesture away</title>
  <desc id="description">An original folded ribbon and three shortcut keys introduce a native Mac file utility</desc>
  <defs>
    <linearGradient id="paper" x2="0" y2="1"><stop stop-color="#fcfdfe"/><stop offset="1" stop-color="#eef1f4"/></linearGradient>
    <linearGradient id="ink" x2="0.3" y2="1"><stop stop-color="#7b8793"/><stop offset="0.5" stop-color="#4e5964"/><stop offset="1" stop-color="#303940"/></linearGradient>
    <linearGradient id="fold" x2="1" y2="1"><stop stop-color="#8794a0"/><stop offset="1" stop-color="#3d4650"/></linearGradient>
    <linearGradient id="glass" x2="0.4" y2="1"><stop stop-color="white" stop-opacity="0.94"/><stop offset="1" stop-color="white" stop-opacity="0.40"/></linearGradient>
    <filter id="shadow" x="-60%" y="-50%" width="220%" height="220%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#152438" flood-opacity="0.09"/></filter>
  </defs>
  <rect width="1280" height="520" rx="24" fill="url(#paper)"/>
  <g fill="#232b32" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="64" y="67" font-size="20" font-weight="600">Fileel</text>
    <text x="64" y="163" font-size="12" letter-spacing="2.6" fill="#6b7580">A SMALLER WAY TO DO MORE</text>
    <text x="60" y="242" font-family="Georgia, serif" font-size="66" letter-spacing="-2.4">Your files.</text>
    <text x="60" y="316" font-family="Georgia, serif" font-size="66" letter-spacing="-2.4">One gesture away.</text>
    <text x="64" y="366" font-size="18" fill="#6b7580">Convert, edit and organize. Right on your Mac.</text>
    <text x="64" y="461" font-size="12" fill="#6b7580">NATIVE MAC APP · OPEN SOURCE</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="823" y="124" width="230" height="250" rx="53" fill="url(#glass)" stroke="white"/>
    <g transform="translate(827 365) scale(.215 -.215)">
      <path fill="url(#ink)" d="M324 274C324 262 334 252 346 252H444C456 252 466 262 466 274V452H637L708 570H466V652H709L780 770H352C337 770 324 757 324 742Z"/>
      <path fill="url(#fold)" d="M709 652L780 770V673L752 632Z M637 452L708 570V474L680 432Z"/>
    </g>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="middle" filter="url(#shadow)" fill="#4a5661">
    <g transform="translate(755 91) rotate(-9)"><rect width="92" height="92" rx="24" fill="url(#glass)" stroke="white"/><text x="46" y="52" font-size="34">⇧</text><text x="46" y="75" font-size="10">CONVERT</text></g>
    <g transform="translate(1069 207) rotate(8)"><rect width="92" height="92" rx="24" fill="url(#glass)" stroke="white"/><text x="46" y="52" font-size="34">⌘</text><text x="46" y="75" font-size="10">TOOLS</text></g>
    <g transform="translate(773 369) rotate(-5)"><rect width="92" height="92" rx="24" fill="url(#glass)" stroke="white"/><text x="46" y="53" font-size="34">⌃</text><text x="46" y="75" font-size="10">ACTIONS</text></g>
  </g>
</svg>
